<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pot</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="/vendor/marked.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head><body>
<div id="config-overlay"><div id="config-modal"><h2 data-i18n="cfg.title">配置 Pot</h2><p data-i18n="cfg.intro">填好接口地址和密钥就能开始。</p><label data-i18n="cfg.endpoint">接口地址</label><input id="cfg-endpoint" placeholder="https://api.openai.com/v1/chat/completions"><label data-i18n="cfg.apiKey">API Key</label><input id="cfg-apikey" type="password" placeholder="sk-..."><label data-i18n="cfg.model">模型</label><input id="cfg-model" placeholder="gpt-4o"><div class="cfg-err" id="cfg-err"></div><div class="cfg-actions"><button class="cfg-skip" id="cfg-skip" data-i18n="cfg.skip">跳过</button><button class="cfg-save" id="cfg-save" data-i18n="cfg.save">保存</button></div></div></div>
<div id="app-shell">
<aside id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-header-row">
      <input type="text" id="session-filter" data-i18n-placeholder="ui.filter" placeholder="筛选会话…" autocomplete="off" spellcheck="false">
    </div>
    <button id="btn-new-session" data-i18n="ui.newSession">＋ 新建会话</button>
  </div>
  <div id="session-list"><div id="session-list-empty" data-i18n-html="ui.sessionsEmpty">还没有会话。<br>点「＋ 新建会话」开始。</div></div>
</aside>
<div id="main-area">
  <div id="header">
    <button id="hamburger-sidebar" data-i18n-title="ui.toggleSidebar" title="展开/收起侧栏">&#x2630;</button>
    <span class="dot"></span><strong>Pot</strong><button type="button" id="model-select" data-i18n-title="ui.modelTitle" title="当前模型：点开换一个，换完自动测一次调用"></button>
    <button type="button" id="btn-scene" data-i18n-title="scene.btnTitle" title="俯视看板场景"><svg class="btn-scene-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4.5v15M15 4.5v15"/></svg><span class="btn-scene-label" data-i18n="scene.btn">看板</span></button>
    <span id="tok-rate" data-i18n-title="ui.rateTitle" title="输出速率：每秒输出 token 数（流式 chunk ≈ 1 token，文字与思考都算）；停笔后停在最后一个数，新建对话才清空"></span>
    <span id="ctx-size" title="当前会话上下文大小：本页本地按消息序列化的 UTF-8 字节估算（含 system 行与工具结果），不走 usage 接口"></span>
    <div id="theme-switch" class="theme-switch" data-i18n-title="ui.themeTitle" title="切换深浅主题">
      <svg class="theme-ic theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="theme-track"><span class="theme-knob"></span></span>
      <svg class="theme-ic theme-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </div>
  </div>
  <div id="chat-wrap"><div id="messages"></div><button id="scroll-bottom" data-i18n-title="ui.scrollBottom" title="回到底部">&#x2193;</button>
    <div id="plan-drawer" class="empty">
      <button id="plan-knob" data-i18n-title="plan.title" title="计划"><span class="plan-knob-label" data-i18n="plan.title">计划</span><span id="plan-count"></span></button>
      <div id="plan-panel">
        <div id="plan-panel-head"><span data-i18n="plan.title">计划</span><button id="plan-close" data-i18n-title="plan.collapse" title="收起">&times;</button></div>
        <ul id="plan-list"></ul>
      </div>
    </div>
  </div>
  <div id="asks-banner"></div>
  <div id="agent-tray" data-i18n-title="ui.subagents" title="子代理"></div>
  <div id="status"></div>
  <div id="input-area">
    <textarea id="input" rows="1" data-i18n-placeholder="ui.inputPlaceholder" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="btn-browse" data-i18n-title="ui.browseFile" title="选择文件">&#x1F4C2;</button>
    <button id="send" data-i18n="ui.send">发送</button>
  </div>
</div>
</div>
<div id="scene-overlay" class="hidden" aria-hidden="true">
  <div id="scene">
    <div id="scene-floor">
      <svg id="scene-links" aria-hidden="true"></svg>
      <div id="scene-bays"></div>
      <div id="scene-center">
        <div id="scene-center-head"><span data-i18n="scene.center">任务板</span><span id="scene-center-count">0</span><span class="scene-head-tools"><button id="scene-select" type="button" data-i18n-title="scene.select" title="批量选择" aria-pressed="false">☑</button><button id="scene-add" type="button" data-i18n-title="scene.add" title="新建卡片">＋</button></span></div>
        <div id="scene-list"></div>
        <div id="scene-bulk" class="hidden"><span id="bulk-note" class="scene-none"></span><button id="bulk-cancel" class="scene-act" type="button" data-i18n="scene.close">关闭</button><button id="bulk-del" class="scene-act danger" type="button" data-i18n="scene.bulkDelete" disabled>删除所选</button></div>
      </div>
    </div>
  </div>
  <div id="scene-todo-modal" class="scene-modal hidden">
    <div class="scene-modal-card">
      <div class="scene-modal-head"><span data-i18n="scene.newCard">新建卡片</span><button class="scene-modal-close" data-close="scene-todo-modal">&times;</button></div>
      <div class="scene-form">
        <input id="nc-title" data-i18n-placeholder="scene.ncTitle" placeholder="标题（目标一句话）">
        <input id="nc-labels" data-i18n-placeholder="scene.ncLabels" placeholder="标签，逗号分隔（如 coding）">
        <div class="scene-form-row">
          <select id="nc-priority"><option value="normal">normal</option><option value="urgent">urgent</option><option value="low">low</option></select>
          <select id="nc-role"></select>
        </div>
        <textarea id="nc-desc" rows="4" data-i18n-placeholder="scene.ncDesc" placeholder="描述（可选）"></textarea>
        <button id="nc-create" class="scene-primary" data-i18n="scene.create">建卡</button>
      </div>
    </div>
  </div>
  <div id="scene-detail-modal" class="scene-modal hidden">
    <div class="scene-modal-card wide">
      <div class="scene-modal-head"><span id="sd-title"></span><button class="scene-modal-close" data-close="scene-detail-modal">&times;</button></div>
      <div id="sd-body"></div>
      <div id="sd-actions"></div>
    </div>
  </div>
  <div id="scene-agent-modal" class="scene-modal hidden">
    <div class="scene-modal-card wide">
      <div class="scene-modal-head"><span id="sa-title"></span><button class="scene-modal-close" data-close="scene-agent-modal">&times;</button></div>
      <div id="sa-cards"></div>
      <div id="sa-transcript"></div>
    </div>
  </div>
</div>
<div id="confirm-overlay"><div id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <p id="confirm-message"></p>
  <div class="confirm-actions"><button id="confirm-cancel"></button><button id="confirm-ok"></button></div>
</div></div>
<div id="agent-modal-overlay"></div>
<div id="drop-overlay" class="hidden" data-i18n="drop.hint">松开，把文件加入对话</div>
<script src="/vendor/gsap.min.js"></script>
<script src="/vendor/Flip.min.js"></script>
<script src="/lang.js"></script>
<script src="/i18n.js"></script>
<script src="/motion.js"></script>
<script src="/common.js"></script>
<script src="/app.js"></script>
</body></html>
